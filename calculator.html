
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9edf5;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      padding: 25px;
      background: #202938;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: white;
      text-align: center;
      margin: 0 0 20px;
    }

    #result {
      width: 100%;
      height: 65px;
      margin-bottom: 20px;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #f8fafc;
      color: #202938;
      font-size: 28px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 10px;
      background: #37465c;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #52647e;
    }

    .operator {
      background: #e58a32;
    }

    .operator:hover {
      background: #c87524;
    }

    .clear {
      background: #dc4c4c;
    }

    .clear:hover {
      background: #bd3535;
    }

    .equal {
      grid-column: span 4;
      background: #16a36a;
      font-weight: bold;
    }

    .equal:hover {
      background: #128453;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h2>Calculator</h2>

    <script>

      function pickValue(val) {
        let numbers = (document.getElementById("result").value += val);
      }

      function solved() {
        let x = document.getElementById("result").value;
        let y = eval(x);
        document.getElementById("result").value = y;
      }

      function clearData() {
        document.getElementById("result").value = "";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key >= 0 && e.key <= 9) {
          console.log(e.key);
          document.getElementById("result").value += e.key;
        }
      });

    </script>

    <input type="text" id="result" placeholder="0" />

    <div class="buttons">

      <button onclick="pickValue(1)">1</button>
      <button onclick="pickValue(2)">2</button>
      <button onclick="pickValue(3)">3</button>
      <button class="operator" onclick="pickValue('+')">+</button>

      <button onclick="pickValue(4)">4</button>
      <button onclick="pickValue(5)">5</button>
      <button onclick="pickValue(6)">6</button>
      <button class="operator" onclick="pickValue('-')">-</button>

      <button onclick="pickValue(7)">7</button>
      <button onclick="pickValue(8)">8</button>
      <button onclick="pickValue(9)">9</button>
      <button class="operator" onclick="pickValue('*')">*</button>

      <button onclick="pickValue(0)">0</button>
      <button class="clear" onclick="clearData()">C</button>
      <button onclick="pickValue('.')">.</button>
      <button class="operator" onclick="pickValue('/')">/</button>

      <button class="equal" onclick="solved()">=</button>

    </div>

  </div>

</body>
</html>
